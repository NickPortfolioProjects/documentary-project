<!doctype html>
<html lang="en" class="fresh-light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>D‑Cine | Search Results</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

  <!-- NAVBAR -->
  <nav id="navbar" class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="assets/images/d-cine-logo-v1.svg" width="90" height="56">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="offcanvas offcanvas-end" id="offcanvasNavbar">
        <div class="offcanvas-header">
          <img src="assets/images/d-cine-logo-v1.svg" width="90" height="56">
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>

        <div class="offcanvas-body">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link mx-lg-2" href="index.html">home</a></li>
            <li class="nav-item"><a class="nav-link mx-lg-2" href="about.html">about</a></li>
            <li class="nav-item"><a class="nav-link mx-lg-2" href="contact.html">contact</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>


  <!-- SEARCH RESULTS -->
  <div class="container mt-5 pt-5">
    <h2 class="mb-4">Search Results</h2>

    <div id="resultsContainer" class="row g-4"></div>
  </div>


  <!-- FOOTER -->
  <footer class="text-center py-4 mt-5">
    <a href="https://www.facebook.com">facebook</a> |
    <a href="https://www.instagram.com">instagram</a> |
    <a href="https://www.x.com">x-twitter</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SEARCH RESULTS JS -->
  <script>
    // Get search term from URL
    const params = new URLSearchParams(window.location.search);
    const query = params.get("q")?.toLowerCase() || "";

    const resultsContainer = document.getElementById("resultsContainer");

    let documentaries = [];

    // Load documentaries
    fetch("assets/data/documentaries.json")
      .then(res => res.json())
      .then(data => {
        documentaries = data;
        showResults();
      });

    function showResults() {
      const matches = documentaries.filter(doc =>
        doc.title.toLowerCase().includes(query) ||
        doc.genre.toLowerCase().includes(query) ||
        (doc.description && doc.description.toLowerCase().includes(query))
      );

      if (!matches.length) {
        resultsContainer.innerHTML = `<p>No results found for "<strong>${query}</strong>".</p>`;
        return;
      }

      matches.forEach(doc => {
        const card = document.createElement("div");
        card.className = "col-12 col-sm-6 col-md-4";

        const imageSrc = doc.image_url || doc.fallback_image;

        card.innerHTML = `
          <div class="card doc-card h-100">
            <img src="${imageSrc}" onerror="this.src='assets/images/fallback.jpg'" class="card-img-top doc-img">
            <div class="card-body">
              <h5 class="card-title">${doc.title}</h5>
              <p class="card-text">
                <strong>Genre:</strong> ${doc.genre}<br>
                <strong>Year:</strong> ${doc.year}<br>
                <strong>Platform:</strong> ${doc.platform}
              </p>
            </div>
          </div>
        `;

        resultsContainer.appendChild(card);
      });
    }
  </script>

</body>
</html>
