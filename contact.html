<!doctype html>
<html lang="en" class="fresh-light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>D‑Cine | Contact</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

  <!-- NAVBAR -->
  <nav id="navbar" class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="assets/images/d-cine-logo-v1.svg" width="90" height="56" alt="d-cine logo">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="offcanvas offcanvas-end" id="offcanvasNavbar">
        <div class="offcanvas-header">
          <img src="assets/images/d-cine-logo-v1.svg" width="90" height="56">
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>

        <div class="offcanvas-body">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link mx-lg-2" href="index.html">home</a></li>
            <li class="nav-item"><a class="nav-link mx-lg-2" href="about.html">about</a></li>
            <li class="nav-item"><a class="nav-link active mx-lg-2" href="contact.html">contact</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>


  <!-- CONTACT FORM -->
  <div class="container mt-5 pt-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8">

        <h2 class="mb-4">Contact D‑Cine</h2>
        <p class="mb-4">Have a question, suggestion, or collaboration idea? Reach out — we’d love to hear from you.</p>

        <form action="success.html" method="GET" class="needs-validation" novalidate>

          <div class="mb-3">
            <label for="name" class="form-label">Full Name *</label>
            <input type="text" class="form-control" id="name" name="name" required>
            <div class="invalid-feedback">Please enter your full name.</div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address *</label>
            <input type="email" class="form-control" id="email" name="email" required>
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>

          <div class="mb-3">
            <label for="subject" class="form-label">Subject *</label>
            <input type="text" class="form-control" id="subject" name="subject" required>
            <div class="invalid-feedback">Please enter a subject.</div>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message *</label>
            <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
            <div class="invalid-feedback">Please enter your message.</div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Send Message</button>

        </form>

      </div>
    </div>
  </div>


  <!-- FOOTER -->
  <footer class="text-center py-4 mt-5">
    <a href="https://www.facebook.com">facebook</a> |
    <a href="https://www.instagram.com">instagram</a> |
    <a href="https://www.x.com">x-twitter</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Bootstrap validation script -->
  <script>
    (() => {
      'use strict';
      const forms = document.querySelectorAll('.needs-validation');
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
            window.location.href = "failed.html";
          }
          form.classList.add('was-validated');
        }, false);
      });
    })();
  </script>

</body>
</html>
